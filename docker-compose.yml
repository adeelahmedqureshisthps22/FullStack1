version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: fullstack-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: fullstack
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - fullstack-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fullstack-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/fullstack
      JWT_SECRET: your-production-secret-key
      JWT_EXPIRE: 7d
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - fullstack-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fullstack-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - fullstack-network

volumes:
  mongodb_data:

networks:
  fullstack-network:
    driver: bridge
